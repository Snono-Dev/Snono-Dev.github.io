<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="تواصل مباشر ومشفّر مع Snono-Dev عبر تطبيق Session" />
    <meta name="author" content="Snono-Dev" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#ff6b00" />
    <meta name="color-scheme" content="dark" />
    <title>Session | Snono-Dev</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="session-page">
    <main class="session-card">
      <a class="back-link" href="index.html">← <span data-i18n="back">العودة إلى الموقع</span></a>
      <p class="eyebrow">SESSION / DIRECT CHAT</p>
      <h1 data-i18n="title">تواصل معي مباشرةً</h1>
      <p class="session-copy" data-i18n="intro">امسح رمز QR بتطبيق Session لبدء محادثة خاصة ومشفّرة.</p>
      <div id="session-qr" class="session-qr" aria-label="Session QR code"></div>
      <p id="session_id" class="session-id"></p>
      <div class="session-actions">
        <button id="copy-btn" class="button button-primary" type="button" data-i18n="copy">نسخ المعرّف 📋</button>
        <a id="session-download" class="button button-outline" href="https://getsession.org/download" target="_blank" rel="noreferrer" data-i18n="download">تحميل تطبيق Session ↗</a>
      </div>
      <p id="session-empty" class="session-empty" hidden></p>
    </main>
    <script src="config.js"></script>
    <script src="session.js"></script>
  </body>
</html>
